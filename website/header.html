<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  body { max-width: 46rem; margin: 0 auto; padding: 2rem 1.25rem 4rem;
         font: 16px/1.65 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         color: #1d1d1f; background: #ffffff; }
  h1 { font-size: 1.9rem; line-height: 1.2; }
  h2 { font-size: 1.3rem; margin-top: 2.2rem; border-bottom: 1px solid #e5e5ea; padding-bottom: .3rem; }
  a { color: #007aff; }
  table { border-collapse: collapse; width: 100%; margin: 1rem 0; font-size: .92rem; display: block; overflow-x: auto; }
  th, td { border: 1px solid #d2d2d7; padding: .5rem .65rem; text-align: left; vertical-align: top; }
  th { background: #f5f5f7; }
  code { background: #f5f5f7; padding: .1rem .3rem; border-radius: 4px; font-size: .88em; }
  pre { background: #f5f5f7; padding: 1rem; border-radius: 10px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  blockquote { border-left: 3px solid #d2d2d7; margin: 1rem 0; padding: .2rem 1rem; color: #555; }
  hr { border: none; border-top: 1px solid #e5e5ea; margin: 2rem 0; }
  @media (prefers-color-scheme: dark) {
    body { color: #f5f5f7; background: #111; }
    h2 { border-color: #333; }
    a { color: #6db2ff; }
    th, td { border-color: #444; }
    th, code, pre { background: #1d1d1f; }
    blockquote { border-color: #444; color: #bbb; }
    hr { border-color: #333; }
  }
</style>
